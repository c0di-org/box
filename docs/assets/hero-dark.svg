<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Box — a real Linux box, inside your phone">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#30A46C" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#30A46C" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="phone"><rect x="762" y="34" width="206" height="272" rx="26"/></clipPath>
  </defs>

  <rect width="1200" height="340" rx="20" fill="#0E120F"/>
  <ellipse cx="960" cy="180" rx="360" ry="260" fill="url(#glow)"/>

  <!-- wordmark -->
  <rect x="88" y="84" width="58" height="58" rx="10.4" fill="#181B19"/><g stroke="#8CE3B5" stroke-width="2.09" stroke-linecap="round"><line x1="103.1" y1="104.9" x2="117.0" y2="97.3"/><line x1="117.0" y1="97.3" x2="130.9" y2="104.9"/><line x1="103.1" y1="104.9" x2="117.0" y2="113.0"/><line x1="130.9" y1="104.9" x2="117.0" y2="113.0"/><line x1="117.0" y1="113.0" x2="117.0" y2="128.7"/><line x1="103.1" y1="104.9" x2="103.1" y2="120.5"/><line x1="103.1" y1="120.5" x2="117.0" y2="128.7"/><line x1="130.9" y1="104.9" x2="130.9" y2="120.5"/><line x1="130.9" y1="120.5" x2="117.0" y2="128.7"/></g>
  <text x="164" y="139" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="62" font-weight="700"
        letter-spacing="-1.5" fill="#E8EBE6">Box</text>

  <text x="88" y="207" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="33" font-weight="650"
        letter-spacing="-0.6" fill="#E8EBE6">A real Linux box, inside your phone.</text>
  <text x="88" y="252" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" fill="#98A39A">Chat with an agent. It clones the repo, installs the deps and runs</text>
  <text x="88" y="279" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" fill="#98A39A">the tests — on a private VM that boots on the device.</text>

  <!-- the phone: a chat, and the work landing in it -->
  <g clip-path="url(#phone)">
    <rect x="762" y="34" width="206" height="272" fill="#161A17"/>
    <rect x="830" y="46" width="70" height="7" rx="3.5" fill="#2F3833"/>

    <rect x="824" y="74" width="122" height="34" rx="12" fill="#33407E"/>
    <text x="838" y="96" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5"
          fill="#C9D2FF">Get it running</text>

    <circle cx="788" cy="140" r="7" fill="#30A46C" opacity=".18"/><path d="M784.5 140 l2.6 2.7 l4.6 -5.2" fill="none" stroke="#8CE3B5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><rect x="802" y="136" width="96" height="8" rx="4.0" fill="#2F3833" opacity="1"/>
    <circle cx="788" cy="168" r="7" fill="#30A46C" opacity=".18"/><path d="M784.5 168 l2.6 2.7 l4.6 -5.2" fill="none" stroke="#8CE3B5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><rect x="802" y="164" width="118" height="8" rx="4.0" fill="#2F3833" opacity="1"/>
    <circle cx="788" cy="196" r="7" fill="#30A46C" opacity=".18"/><path d="M784.5 196 l2.6 2.7 l4.6 -5.2" fill="none" stroke="#8CE3B5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><rect x="802" y="192" width="74" height="8" rx="4.0" fill="#2F3833" opacity="1"/>
    <circle cx="788" cy="224" r="7" fill="none" stroke="#30A46C"
            stroke-width="1.9" stroke-dasharray="3.2 3.4" opacity=".9"/>
    <rect x="802" y="220" width="104" height="8" rx="4.0" fill="#2F3833" opacity=".55"/>
  </g>
  <rect x="762" y="34" width="206" height="272" rx="26" fill="none"
        stroke="#2A312C" stroke-width="2"/>

  <!-- and the computer it all really happened on -->
  <rect x="902" y="150" width="254" height="158" rx="13" fill="#0A0E0B"/>
  <rect x="902" y="150" width="254" height="158" rx="13" fill="none"
        stroke="#2A312C" stroke-width="1.5"/>
  <path d="M902 180 h254" stroke="#2A312C" stroke-width="1.5" opacity=".7"/>
  <circle cx="920" cy="165" r="4" fill="#E5786A"/>
  <circle cx="935" cy="165" r="4" fill="#E3C36A"/>
  <circle cx="950" cy="165" r="4" fill="#30A46C"/>
  <text x="920" y="206" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#8CE3B5">$ git clone git@…/box.git</text>
  <text x="920" y="230" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#8B958D">  Cloning into 'box'…</text>
  <text x="920" y="254" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#8CE3B5">$ npm test</text>
  <text x="920" y="278" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#8B958D">  119 passing</text>
  <rect x="1002" y="268" width="8" height="13" fill="#8CE3B5" opacity=".85"/>
</svg>
