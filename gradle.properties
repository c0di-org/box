org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Default app version for local builds. Library release builds can override these properties.
boxVersionCode=4
boxVersionName=0.1.3

# Box's GitHub App, which is how a box connects to GitHub. See docs/github-auth.md.
#
# The client id is public and is meant to be here: the device flow Box uses has no client secret,
# which is exactly why a phone app can run it at all. A fork points these at its own app.
box.github.clientId=Iv23ctD12lBb3VAZwutv
box.github.appSlug=box-agent
