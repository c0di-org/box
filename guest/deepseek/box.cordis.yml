# Box's first DeepSeek Harness composition.
#
# The QEMU guest is Box's security boundary, so DSH is deliberately given
# danger-full-access inside that guest instead of nesting bwrap/Landlock around
# every command. Box's own harness wrapper remains the UI/protocol boundary.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max
    models:
      - id: deepseek-v4-flash
      - id: deepseek-v4-pro

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.env.BOX_SESSION_CWD ?? process.cwd()

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-sandbox'
  config:
    timeoutMs: 120000

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    # In this profile the outer VM is the confinement boundary. ACP still has
    # a permission channel if a future Box profile introduces guarded actions.
    policy: ask

- id: acp-agent
  name: '@deepseek-ai/dsh-acp-demo'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash
    dshHome: !!js process.env.DSH_HOME ?? '/workspace/.config/dsh'
    persistenceRoot: !!js process.env.DSH_SESSION_ROOT ?? '/workspace/.config/dsh/sessions'
    workspaceContext:
      maxBytes: 65536
    persona: |
      You are a coding agent running inside Box, an ARM64 Debian virtual machine on the user's Android device.
      Your working directory is {{cwd}}. Work directly in that machine and verify changes by running tests or commands.
      Keep final answers concise and factual.

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.08
    maxTokens: 8192
    compactionRetries: 1

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.BOX_SESSION_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
