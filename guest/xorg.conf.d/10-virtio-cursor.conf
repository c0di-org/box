# Draw the mouse cursor in software.
#
# virtio-gpu exposes a hardware cursor plane and the modesetting driver takes it by default. A
# hardware cursor is an overlay: it is composited by the display engine and is never part of the
# framebuffer. QEMU's VNC server therefore cannot put it in a framebuffer update -- it can only
# send it out of band, through the Cursor pseudo-encoding (-239).
#
# Box's RFB client does not offer -239. It offers Raw, CopyRect and DesktopSize, and it is
# deliberately strict: a server using an encoding that was never offered is treated as a broken
# stream. So QEMU is correct to stay silent, and the consequence is that the guest's pointer was
# never transmitted at all -- invisible on a machine whose only display is that framebuffer.
#
# Drawing it in software puts the cursor back in the framebuffer, where the encodings Box does
# offer will carry it. The cost is a small damage rectangle on every pointer move, which is real
# but cheap next to a desktop nobody can point at. Implementing -239 client-side is the better
# long-term fix -- the cursor would then stay responsive independently of framebuffer refresh --
# and this option should be revisited if that lands.

Section "Device"
    Identifier "virtio-gpu"
    Driver "modesetting"
    Option "SWcursor" "true"
EndSection
