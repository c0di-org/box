# Never blank, never power the display down.
#
# X comes up with DPMS enabled and a ten-minute timer, which is the right default for a laptop and
# wrong for every machine Box runs. `xset q` in a live guest, at the moment a user was looking at
# "No picture":
#
#     Screen Saver:  timeout: 0   cycle: 600
#     DPMS (Energy Star):  Standby: 600  Suspend: 600  Off: 600
#       DPMS is Enabled
#       Monitor is Off          <-- this
#
# There is no power here to manage. The display is a virtio-gpu scanout QEMU serves over VNC, and
# turning it off saves a phone nothing while costing it the only picture it has.
#
# What makes it unrecoverable rather than merely wrong is that nothing in a Box can wake it. DPMS
# wakes on X input, and there are exactly two possible sources: the user, whose input only reaches
# the guest once they have taken control (`VncDesktop.send`) -- and you cannot take control of a
# pane showing you nothing -- and the agent, which generates no X input at all. There is no
# `xdotool` in this image; the agent can screenshot the desktop but not drive it. So the desktop
# turns itself off after ten idle minutes and stays off.
#
# Set here rather than as `xset s off -dpms` in a session script because it belongs to the server
# and not to whatever happens to start a session: `local-agent-desktop.service` runs openbox today,
# and a desktop that came up some other way would want this just as much. Zero disables the timer;
# it does not disable DPMS as a capability, so `xset dpms force off` still works for anything that
# ever deliberately wants it.

Section "ServerFlags"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
